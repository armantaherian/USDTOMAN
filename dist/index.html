<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>قیمت سالانه دلار در ایران</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><link rel="stylesheet" href="style.css"><script defer src="app.js"></script><script defer src="alpine.min.js"></script></head>
<body class="bg-page text-ink antialiased"><main x-data="dollarTable" class="mx-auto max-w-[860px] px-4 py-6 sm:px-7 sm:py-8">
<header class="mb-5 flex items-center justify-between gap-4"><h1 class="text-lg font-semibold sm:text-2xl" x-text="t.title"></h1><nav class="flex shrink-0 gap-1.5" aria-label="Preferences"><button class="icon-button text-xs font-semibold" @click="toggleLanguage" :aria-label="lang==='fa'?'English':'فارسی'" :title="lang==='fa'?'English':'فارسی'" x-text="lang==='fa'?'EN':'FA'"></button><button class="icon-button text-lg" @click="toggleTheme" :aria-label="theme==='dark'?t.light:t.dark" :title="theme==='dark'?t.light:t.dark" :aria-pressed="theme==='dark'" x-text="theme==='dark'?'☀':'☾'"></button></nav></header>
<p class="mb-3 text-[11px] text-muted" x-show="data" x-text="data?t.coverage+' '+formatDate(data.latestDate):''"></p>
<div class="overflow-x-auto rounded-xl border border-line bg-surface"><table class="w-full table-fixed border-collapse text-start text-xs sm:text-sm"><thead class="bg-tint text-muted"><tr><template x-for="column in columns" :key="column.key"><th scope="col" :class="column.key==='government'?'w-[34%]':column.key==='year'?'w-[16%]':'w-[25%]'" :aria-sort="sortKey===column.key?(ascending?'ascending':'descending'):'none'"><button class="flex w-full items-center gap-1.5 px-2 py-3 text-start font-medium transition-colors hover:text-ink sm:px-4 sm:py-3.5" @click="sortBy(column.key)"><span><span x-text="t[column.key]"></span><small x-show="column.unit" class="mt-0.5 block text-[9px] font-normal opacity-75 sm:ms-1 sm:inline sm:text-[10px]" x-text="'('+t.unit+')'"></small></span><span aria-hidden="true" class="text-[11px]" :class="sortKey===column.key?'text-accent':'opacity-40'" x-text="sortKey===column.key?(ascending?'↑':'↓'):'↕'"></span></button></th></template></tr></thead>
<tbody class="divide-y divide-line"><template x-for="row in sortedRows" :key="row.year"><tr class="transition-colors hover:bg-tint"><td class="px-2 py-3 font-medium tabular-nums sm:px-4 sm:py-3.5" x-text="formatYear(row.year)"></td><td class="px-2 py-3 government-cell text-[9px] leading-5 text-muted sm:px-4 sm:py-3.5"><span class="block overflow-x-auto whitespace-nowrap" x-text="row.government.map(person=>person[lang]).join(lang==='fa'?'، ':', ')"></span></td><td class="px-2 py-3 tabular-nums sm:px-4 sm:py-3.5" x-text="formatPrice(row.minimum)"></td><td class="px-2 py-3 text-accent tabular-nums sm:px-4 sm:py-3.5" x-text="formatPrice(row.maximum)"></td></tr></template></tbody></table><p role="status" class="px-4 py-5 text-sm text-muted" x-show="loading||error" x-text="error?t.error:t.loading"></p></div>
<footer class="mt-5 flex flex-wrap items-center gap-x-2 gap-y-1 border-t border-line pt-4 text-[11px] text-muted"><span x-text="t.source"></span><a class="source-link" href="https://www.tgju.org/profile/price_dollar_rl/history" target="_blank" rel="noopener">TGJU ↗</a><span>·</span><a class="source-link" href="https://netarz.ir/wiki/dollar-price-by-year" target="_blank" rel="noopener">NetArz / نِت اَرز ↗</a><span>·</span><a class="source-link" href="https://www.khabaronline.ir/news/189536" target="_blank" rel="noopener">KhabarOnline / خبرآنلاین ↗</a></footer>
</main></body></html>
