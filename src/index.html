<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>قیمت سالانه دلار در ایران</title>
    <meta
      name="description"
      content="جدول قیمت دلار در ایران از ۱۳۵۷ تا امروز؛ کمترین و بیشترین نرخ سالانه به تومان، همراه با نام دولت‌ها. Yearly USD prices in Iran, in toman."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#ecebdc" />
    <link rel="canonical" href="https://ohmydevops.github.io/USDTOMAN/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="USD / Toman" />
    <meta
      property="og:title"
      content="قیمت سالانه دلار در ایران | USD / Toman"
    />
    <meta
      property="og:description"
      content="کمترین و بیشترین قیمت سالانه دلار به تومان، از ۱۳۵۷ تا امروز، همراه با نام دولت‌ها."
    />
    <meta property="og:url" content="https://ohmydevops.github.io/USDTOMAN/" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:image"
      content="https://ohmydevops.github.io/USDTOMAN/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="USD / Toman — yearly dollar prices in Iran"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="USD / Toman | قیمت سالانه دلار در ایران"
    />
    <meta
      name="twitter:description"
      content="Yearly minimum and maximum US dollar prices in Iran, in toman."
    />
    <meta
      name="twitter:image"
      content="https://ohmydevops.github.io/USDTOMAN/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="USD / Toman — yearly dollar prices in Iran"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "USD / Toman",
        "alternateName": "قیمت سالانه دلار در ایران",
        "url": "https://ohmydevops.github.io/USDTOMAN/",
        "description": "Yearly US dollar price ranges in Iran, in toman, with government names.",
        "inLanguage": ["fa", "en"]
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="app.js"></script>
    <script defer src="alpine.min.js"></script>
  </head>
  <body class="bg-page text-ink antialiased">
    <main
      x-data="dollarTable"
      class="mx-auto max-w-[860px] px-4 py-6 sm:px-7 sm:py-8"
    >
      <header class="mb-5 flex items-center justify-between gap-4">
        <h1 class="text-lg font-semibold sm:text-2xl" x-text="t.title">
          قیمت سالانه دلار در ایران
        </h1>
        <nav class="flex shrink-0 gap-1.5" aria-label="Preferences">
          <button
            class="icon-button text-[10px] font-semibold leading-none"
            @click="toggleLanguage"
            :aria-label="lang==='fa'?'English':'فارسی'"
            :title="lang==='fa'?'English':'فارسی'"
            x-text="lang==='fa'?'EN':'FA'"
          ></button
          ><button
            class="icon-button"
            @click="toggleTheme"
            :aria-label="theme==='dark'?t.light:t.dark"
            :title="theme==='dark'?t.light:t.dark"
            :aria-pressed="theme==='dark'"
          >
            <svg
              x-show="theme==='dark'"
              class="size-3.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
              />
            </svg>
            <svg
              x-show="theme==='light'"
              class="size-3.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 15.2A8.4 8.4 0 0 1 8.8 4a8.4 8.4 0 1 0 11.2 11.2Z" />
            </svg>
          </button>
        </nav>
      </header>
      <p
        class="mb-3 text-[11px] text-muted"
        x-show="data"
        x-text="data?t.coverage+' '+formatDate(data.latestDate):''"
      ></p>
      <div class="overflow-hidden rounded-xl border border-line bg-surface">
        <table
          class="w-full table-fixed border-collapse text-start text-xs sm:text-sm"
        >
          <thead class="bg-tint text-muted">
            <tr>
              <template x-for="column in columns" :key="column.key"
                ><th
                  scope="col"
                  :class="column.key==='government'?'w-[50%]':column.key==='year'?'w-[12%]':'w-[19%]'"
                  :aria-sort="column.key==='government'?null:sortKey===column.key?(ascending?'ascending':'descending'):'none'"
                >
                  <span
                    x-show="column.key==='government'"
                    class="block px-2 py-3 font-medium sm:px-4 sm:py-3.5"
                    x-text="t.government"
                  ></span>
                  <button
                    x-show="column.key!=='government'"
                    class="flex w-full items-center gap-1.5 px-2 py-3 text-start font-medium transition-colors hover:text-ink sm:px-4 sm:py-3.5"
                    @click="sortBy(column.key)"
                  >
                    <span
                      ><span x-text="t[column.key]"></span
                      ><small
                        x-show="column.unit"
                        class="mt-0.5 block text-[9px] font-normal opacity-75 sm:ms-1 sm:inline sm:text-[10px]"
                        x-text="'('+t.unit+')'"
                      ></small></span
                    ><span
                      aria-hidden="true"
                      class="text-[11px]"
                      :class="sortKey===column.key?'text-accent':'opacity-40'"
                      x-text="sortKey===column.key?(ascending?'↑':'↓'):'↕'"
                    ></span>
                  </button></th
              ></template>
            </tr>
          </thead>
          <tbody class="divide-y divide-line">
            <template x-for="(row, index) in sortedRows" :key="row.year"
              ><tr
                class="table-row hover:bg-tint"
                :style="{'--row-delay': Math.min(index, 18) * 28 + 'ms'}"
              >
                <td
                  class="px-2 py-3 font-medium tabular-nums sm:px-4 sm:py-3.5"
                >
                  <template x-if="row.year >= 1390">
                    <a
                      class="text-accent underline decoration-accent/30 underline-offset-4 transition-colors hover:decoration-accent"
                      href="https://www.tgju.org/profile/price_dollar_rl/charts"
                      target="_blank"
                      rel="noopener"
                      :title="lang==='fa'?'نمودار دلار در TGJU؛ بازهٔ سال '+formatYear(row.year)+' را انتخاب کنید':'TGJU dollar chart; select the date range for '+row.year"
                      x-text="formatYear(row.year)"
                    ></a>
                  </template>
                  <template x-if="row.year < 1390"
                    ><span x-text="formatYear(row.year)"></span
                  ></template>
                </td>
                <td
                  class="px-2 py-3 text-[10px] leading-4 text-muted sm:px-4 sm:py-3.5 sm:text-sm sm:leading-5"
                >
                  <span
                    class="block whitespace-normal break-words"
                    x-text="row.government.map(person=>person[lang]).join(lang==='fa'?'، ':', ')"
                  ></span>
                </td>
                <td
                  class="px-2 py-3 tabular-nums sm:px-4 sm:py-3.5"
                  x-text="formatPrice(row.minimum)"
                ></td>
                <td
                  class="px-2 py-3 text-accent tabular-nums sm:px-4 sm:py-3.5"
                  x-text="formatPrice(row.maximum)"
                ></td></tr
            ></template>
          </tbody>
        </table>
        <p
          role="status"
          class="px-4 py-5 text-sm text-muted"
          x-show="loading||error"
          x-text="error?t.error:t.loading"
        ></p>
      </div>
      <footer
        class="mt-5 flex flex-wrap items-center gap-x-2 gap-y-1 border-t border-line pt-4 text-[11px] text-muted"
      >
        <span x-text="t.source"></span
        ><a
          class="source-link"
          href="https://www.tgju.org/profile/price_dollar_rl/history"
          target="_blank"
          rel="noopener"
          >TGJU ↗</a
        ><span>·</span
        ><a
          class="source-link"
          href="https://netarz.ir/wiki/dollar-price-by-year"
          target="_blank"
          rel="noopener"
          >NetArz / نِت اَرز ↗</a
        ><span>·</span
        ><a
          class="source-link"
          href="https://www.khabaronline.ir/news/189536"
          target="_blank"
          rel="noopener"
          >KhabarOnline / خبرآنلاین ↗</a
        >
        <a
          class="source-link ms-auto"
          href="https://github.com/ohmydevops/USDTOMAN"
          target="_blank"
          rel="noopener"
          >GitHub ↗</a
        >
      </footer>
    </main>
  </body>
</html>
